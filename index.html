<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียน D506 อุดรธานี</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { kanit: ['Kanit', 'sans-serif'] }, colors: { brand: { light: '#ccfbf1', DEFAULT: '#0d9488', dark: '#0f766e' } } } }
    }
  </script>
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    #loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 50; justify-content: center; align-items: center; }
  </style>
</head>
<body class="text-slate-800">

  <div id="loader" class="flex flex-col gap-4">
    <div class="w-12 h-12 border-4 border-brand border-t-transparent rounded-full animate-spin"></div>
    <p class="font-medium text-brand">กำลังดำเนินการ...</p>
  </div>

  <!-- Header -->
  <header class="bg-gradient-to-r from-blue-800 to-brand-dark text-white py-10 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 flex flex-col md:flex-row items-center gap-6">
      <div class="bg-white p-2 rounded-2xl shadow-xl w-24 h-24 flex items-center justify-center overflow-hidden">
        <img src="https://i.ibb.co/3yb1bdhc/logo-moph.png" alt="MOPH" class="object-contain">
      </div>
      <div class="text-center md:text-left">
        <h1 class="text-2xl md:text-3xl font-bold">โครงการอบรมการรายงานโรคติดต่อระบบ D506</h1>
        <p class="text-teal-100 text-lg mt-1">จังหวัดอุดรธานี ปีงบประมาณ 2569</p>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 -mt-8">
    <!-- Tabs -->
    <nav class="bg-white p-2 rounded-2xl shadow-md mb-8 flex gap-2 border border-slate-200 overflow-x-auto">
      <button onclick="switchTab('home')" id="btn-home" class="flex-1 py-3 px-6 rounded-xl font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap">
        <i data-lucide="home" class="w-5 h-5"></i> หน้าแรก
      </button>
      <button onclick="switchTab('reg')" id="btn-reg" class="flex-1 py-3 px-6 rounded-xl font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap">
        <i data-lucide="user-plus" class="w-5 h-5"></i> ลงทะเบียน
      </button>
      <button onclick="switchTab('dash')" id="btn-dash" class="flex-1 py-3 px-6 rounded-xl font-medium transition-all flex items-center justify-center gap-2 whitespace-nowrap">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i> แดชบอร์ดจัดการข้อมูล
      </button>
    </nav>

    <!-- Contents -->
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 p-6 md:p-10 mb-10 min-h-[500px]">
      
      <!-- HOME TAB (Poster Style) -->
      <div id="tab-home" class="tab-content active">
        <!-- (ส่วนนี้เหมือนเดิม หรือใส่ข้อมูลย่อๆ ได้) -->
        <div class="text-center py-10">
          <h2 class="text-3xl font-bold text-slate-800 mb-6">ยินดีต้อนรับสู่ระบบรายงานข้อมูล</h2>
          <button onclick="switchTab('reg')" class="bg-brand text-white px-8 py-4 rounded-full font-bold text-xl shadow-lg hover:scale-105 transition-transform">ลงทะเบียนทันที</button>
        </div>
      </div>

      <!-- REGISTRATION TAB -->
      <div id="tab-reg" class="tab-content">
        <h3 class="text-2xl font-bold mb-6 flex items-center gap-3"><i data-lucide="edit-3" class="text-brand"></i> แบบฟอร์มลงทะเบียน</h3>
        <form onsubmit="handleRegister(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div><label class="block mb-2 font-medium">ชื่อ-นามสกุล</label><input type="text" name="fullname" required class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-brand outline-none"></div>
          <div><label class="block mb-2 font-medium">ตำแหน่ง</label><input type="text" name="position" required class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-brand outline-none"></div>
          <div><label class="block mb-2 font-medium">สถานที่ปฏิบัติงาน</label><input type="text" name="workplace" required class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-brand outline-none"></div>
          <div><label class="block mb-2 font-medium">อำเภอ</label>
            <select name="district" required class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-brand outline-none">
              <option value="">-- เลือกอำเภอ --</option>
              <option>เมืองอุดรธานี</option><option>กุดจับ</option><option>หนองวัวซอ</option><option>กุมภวาปี</option>
              <option>โนนสะอาด</option><option>หนองหาน</option><option>ทุ่งฝน</option><option>ไชยวาน</option>
              <option>ศรีธาตุ</option><option>วังสามหมอ</option><option>บ้านดุง</option><option>บ้านผือ</option>
              <option>น้ำโสม</option><option>เพ็ญ</option><option>สร้างคอม</option><option>หนองแสง</option>
              <option>นายูง</option><option>พิบูลรักษ์</option><option>กู่แก้ว</option><option>ประจักษ์ศิลปาคม</option>
            </select>
          </div>
          <div class="md:col-span-2"><label class="block mb-2 font-medium">อีเมล</label><input type="email" name="email" required class="w-full p-3 border rounded-xl bg-slate-50 focus:ring-2 focus:ring-brand outline-none"></div>
          <div class="md:col-span-2">
            <label class="block mb-4 font-medium">สถานะการเข้าร่วม</label>
            <div class="flex flex-col sm:flex-row gap-4">
              <label class="flex-1 p-4 border rounded-xl cursor-pointer has-[:checked]:bg-teal-50 has-[:checked]:border-brand transition-all">
                <input type="radio" name="attendance" value="สามารถเข้าร่วมอบรมได้" required class="mr-2"> เข้าร่วมได้
              </label>
              <label class="flex-1 p-4 border rounded-xl cursor-pointer has-[:checked]:bg-red-50 has-[:checked]:border-red-500 transition-all">
                <input type="radio" name="attendance" value="ไม่สามารถเข้าร่วมอบรมได้" required class="mr-2"> ไม่เข้าร่วม
              </label>
            </div>
          </div>
          <button type="submit" class="md:col-span-2 bg-brand text-white py-4 rounded-xl font-bold text-lg hover:bg-brand-dark shadow-lg">ยืนยันข้อมูล</button>
        </form>
      </div>

      <!-- DASHBOARD TAB -->
      <div id="tab-dash" class="tab-content">
        <!-- สรุปผล 20 อำเภอ -->
        <h4 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="map" class="text-brand"></i> สรุปผลรายอำเภอ (20 อำเภอ)</h4>
        <div class="overflow-x-auto mb-10 rounded-2xl border">
          <table class="w-full text-left border-collapse min-w-[600px]">
            <thead class="bg-slate-50 border-b">
              <tr>
                <th class="p-4 font-bold text-slate-600">อำเภอ</th>
                <th class="p-4 font-bold text-blue-600 text-center">ลงทะเบียนแล้ว</th>
                <th class="p-4 font-bold text-teal-600 text-center">มาได้</th>
                <th class="p-4 font-bold text-red-600 text-center">มาไม่ได้</th>
              </tr>
            </thead>
            <tbody id="district-summary-body" class="divide-y">
              <!-- JS Injected here -->
            </tbody>
          </table>
        </div>

        <!-- รายละเอียดรายชื่อ + จัดการ -->
        <h4 class="text-xl font-bold mb-4 flex items-center gap-2"><i data-lucide="users" class="text-brand"></i> จัดการรายชื่อผู้ลงทะเบียน</h4>
        <div class="overflow-x-auto rounded-2xl border">
          <table class="w-full text-left border-collapse min-w-[800px]">
            <thead class="bg-slate-100 border-b">
              <tr>
                <th class="p-4">ลำดับ</th>
                <th class="p-4">ชื่อ-นามสกุล</th>
                <th class="p-4">หน่วยงาน</th>
                <th class="p-4">สถานะ</th>
                <th class="p-4 text-center">จัดการ</th>
              </tr>
            </thead>
            <tbody id="participant-list-body" class="divide-y">
              <!-- JS Injected here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzaaWWRjcNcrvMuLQMHOV5m8m6tujKZ_Gd9kIk737LNqhAHup-YA6YVCa15r5OWHkjC/exec'; // *** ใส่ URL จากการ Deploy ของคุณที่นี่ ***

    lucide.createIcons();

    function switchTab(t) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + t).classList.add('active');
      
      const btns = ['home', 'reg', 'dash'];
      btns.forEach(b => {
        const el = document.getElementById('btn-' + b);
        if(b === t) {
          el.className = "flex-1 py-3 px-6 rounded-xl font-medium bg-brand text-white shadow-lg transition-all flex items-center justify-center gap-2 whitespace-nowrap";
        } else {
          el.className = "flex-1 py-3 px-6 rounded-xl font-medium text-slate-600 hover:bg-slate-50 transition-all flex items-center justify-center gap-2 whitespace-nowrap border border-transparent";
        }
      });
      if(t === 'dash') fetchDashboard();
    }
    switchTab('home');

    async function handleRegister(e) {
      e.preventDefault();
      const form = e.target;
      const data = {
        fullname: form.fullname.value,
        position: form.position.value,
        workplace: form.workplace.value,
        district: form.district.value,
        email: form.email.value,
        attendance: form.attendance.value
      };
      
      showLoader(true);
      try {
        const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register', data }) });
        const result = await res.json();
        if(result.status === 'success') {
          Swal.fire('สำเร็จ!', 'ลงทะเบียนเรียบร้อยแล้ว', 'success');
          form.reset();
          switchTab('dash');
        } else {
          Swal.fire('ผิดพลาด', result.message, 'error');
        }
      } catch(err) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error'); }
      showLoader(false);
    }

    async function fetchDashboard() {
      try {
        const res = await fetch(SCRIPT_URL + '?action=getDashboard');
        const data = await res.json();
        renderDashboard(data);
      } catch(err) { console.error(err); }
    }

    function renderDashboard(data) {
      // 1. Render District Summary (4 Columns)
      const distBody = document.getElementById('district-summary-body');
      distBody.innerHTML = '';
      Object.entries(data.districtSummary).forEach(([name, stats]) => {
        distBody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-4 font-medium text-slate-700">${name}</td>
            <td class="p-4 text-center font-bold text-blue-600">${stats.total}</td>
            <td class="p-4 text-center font-bold text-teal-600">${stats.attending}</td>
            <td class="p-4 text-center font-bold text-red-500">${stats.absent}</td>
          </tr>
        `;
      });

      // 2. Render Participant Table with Action Buttons
      const partBody = document.getElementById('participant-list-body');
      partBody.innerHTML = '';
      data.list.forEach((p, idx) => {
        const statusClass = p.status === 'สามารถเข้าร่วมอบรมได้' ? 'text-teal-600 bg-teal-50' : 'text-red-600 bg-red-50';
        partBody.innerHTML += `
          <tr class="hover:bg-slate-50">
            <td class="p-4 text-slate-400">${data.list.length - idx}</td>
            <td class="p-4 font-bold">${p.name} <br><span class="text-xs font-normal text-slate-400">${p.position}</span></td>
            <td class="p-4 text-sm">${p.workplace} <span class="text-slate-400">(${p.district})</span></td>
            <td class="p-4"><span class="px-3 py-1 rounded-full text-xs font-bold ${statusClass}">${p.status.split(' ')[0]}</span></td>
            <td class="p-4 text-center flex justify-center gap-2">
              <button onclick='openEditModal(${JSON.stringify(p)})' class="p-2 text-blue-600 hover:bg-blue-50 rounded-lg" title="แก้ไข"><i data-lucide="pencil" class="w-5 h-5"></i></button>
              <button onclick="handleDelete(${p.rowIndex})" class="p-2 text-red-600 hover:bg-red-50 rounded-lg" title="ลบ"><i data-lucide="trash-2" class="w-5 h-5"></i></button>
            </td>
          </tr>
        `;
      });
      lucide.createIcons();
    }

    async function handleDelete(rowIndex) {
      const confirm = await Swal.fire({
        title: 'ยืนยันการลบ?',
        text: "ข้อมูลนี้จะถูกลบออกจากระบบอย่างถาวร",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonText: 'ยกเลิก',
        confirmButtonText: 'ใช่, ลบเลย'
      });

      if (confirm.isConfirmed) {
        showLoader(true);
        try {
          const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', rowIndex }) });
          const result = await res.json();
          if(result.status === 'success') {
            Swal.fire('ลบแล้ว!', 'ข้อมูลถูกนำออกแล้ว', 'success');
            fetchDashboard();
          }
        } catch(e) { Swal.fire('Error', 'ลบไม่สำเร็จ', 'error'); }
        showLoader(false);
      }
    }

    async function openEditModal(p) {
      const { value: formValues } = await Swal.fire({
        title: 'แก้ไขข้อมูลผู้ลงทะเบียน',
        html: `
          <input id="swal-name" class="swal2-input" placeholder="ชื่อ-นามสกุล" value="${p.name}">
          <input id="swal-pos" class="swal2-input" placeholder="ตำแหน่ง" value="${p.position}">
          <input id="swal-work" class="swal2-input" placeholder="หน่วยงาน" value="${p.workplace}">
          <select id="swal-dist" class="swal2-input">
            <option>${p.district}</option>
            <option>เมืองอุดรธานี</option><option>กุดจับ</option><option>หนองวัวซอ</option><option>กุมภวาปี</option>
            <option>โนนสะอาด</option><option>หนองหาน</option><option>ทุ่งฝน</option><option>ไชยวาน</option>
            <option>ศรีธาตุ</option><option>วังสามหมอ</option><option>บ้านดุง</option><option>บ้านผือ</option>
            <option>น้ำโสม</option><option>เพ็ญ</option><option>สร้างคอม</option><option>หนองแสง</option>
            <option>นายูง</option><option>พิบูลรักษ์</option><option>กู่แก้ว</option><option>ประจักษ์ศิลปาคม</option>
          </select>
          <input id="swal-email" class="swal2-input" placeholder="อีเมล" value="${p.email}">
          <select id="swal-att" class="swal2-input">
            <option value="สามารถเข้าร่วมอบรมได้" ${p.status.includes('สามารถ') ? 'selected' : ''}>สามารถเข้าร่วมได้</option>
            <option value="ไม่สามารถเข้าร่วมอบรมได้" ${p.status.includes('ไม่') ? 'selected' : ''}>ไม่สามารถเข้าร่วมได้</option>
          </select>
        `,
        focusConfirm: false,
        showCancelButton: true,
        confirmButtonText: 'บันทึกการแก้ไข',
        preConfirm: () => {
          return {
            fullname: document.getElementById('swal-name').value,
            position: document.getElementById('swal-pos').value,
            workplace: document.getElementById('swal-work').value,
            district: document.getElementById('swal-dist').value,
            email: document.getElementById('swal-email').value,
            attendance: document.getElementById('swal-att').value
          }
        }
      });

      if (formValues) {
        showLoader(true);
        try {
          const res = await fetch(SCRIPT_URL, { 
            method: 'POST', 
            body: JSON.stringify({ action: 'update', rowIndex: p.rowIndex, data: formValues }) 
          });
          const result = await res.json();
          if(result.status === 'success') {
            Swal.fire('สำเร็จ', 'อัปเดตข้อมูลแล้ว', 'success');
            fetchDashboard();
          }
        } catch(e) { Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error'); }
        showLoader(false);
      }
    }

    function showLoader(s) { document.getElementById('loader').style.display = s ? 'flex' : 'none'; }
  </script>
</body>
</html>
